name: Refresh data

on:
  schedule:
    # Prices daily at 11:00 UTC; benchmarks also refreshed on Mondays.
    - cron: "0 11 * * 1"
    - cron: "0 11 * * 0,2-6"
  workflow_dispatch:
    inputs:
      skip_prices:
        description: "Skip retailer price fetching"
        type: boolean
        default: false
      skip_benchmarks:
        description: "Skip the Tom's Hardware fetch"
        type: boolean
        default: false
      dry_run:
        description: "Build but do not commit or open a PR"
        type: boolean
        default: false

permissions:
  actions: write # Dispatch deployment after a clean data commit.
  contents: write
  pull-requests: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[dev]"

      - name: Check Newegg credentials
        if: ${{ inputs.skip_prices != true }}
        env:
          RAKUTEN_CLIENT_ID: ${{ secrets.RAKUTEN_CLIENT_ID }}
          RAKUTEN_CLIENT_SECRET: ${{ secrets.RAKUTEN_CLIENT_SECRET }}
          RAKUTEN_SID: ${{ secrets.RAKUTEN_SID }}
        run: |
          for name in RAKUTEN_CLIENT_ID RAKUTEN_CLIENT_SECRET RAKUTEN_SID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done

      - name: Build
        id: build
        env:
          RAKUTEN_CLIENT_ID: ${{ secrets.RAKUTEN_CLIENT_ID }}
          RAKUTEN_CLIENT_SECRET: ${{ secrets.RAKUTEN_CLIENT_SECRET }}
          RAKUTEN_SID: ${{ secrets.RAKUTEN_SID }}
        run: |
          ARGS="--run-id gh-${{ github.run_id }} --retailers newegg,manual"
          if [ "${{ inputs.skip_prices }}" = "true" ]; then ARGS="$ARGS --skip-prices"; fi
          if [ "${{ inputs.skip_benchmarks }}" = "true" ]; then ARGS="$ARGS --skip-benchmarks"; fi
          if [ "${{ github.event.schedule }}" = "0 11 * * 0,2-6" ]; then ARGS="$ARGS --skip-benchmarks"; fi
          svi build $ARGS

      - name: Validate
        run: pytest -q

      - name: Upload report and snapshots
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: refresh-${{ github.run_id }}
          path: |
            data/site/review_report.md
            data/raw/prices/
            data/processed/prices_history.csv
            data/raw/benchmarks/toms/*.html
          retention-days: 90
          if-no-files-found: ignore

      - name: Commit directly (clean run)
        id: commit
        if: ${{ steps.build.outputs.needs_review == 'false' && inputs.dry_run != true }}
        run: |
          git config user.name "svi-refresh[bot]"
          git config user.email "svi-refresh@users.noreply.github.com"
          git add data/processed data/site data/raw/prices
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "data: refresh ${{ steps.build.outputs.run_id }}"
          git push
          echo "published=true" >> "$GITHUB_OUTPUT"

      # A push with GITHUB_TOKEN does not trigger the push-based deployment.
      - name: Deploy refreshed data
        if: ${{ steps.commit.outputs.published == 'true' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

      - name: Open pull request (needs review)
        if: ${{ steps.build.outputs.needs_review == 'true' && inputs.dry_run != true }}
        uses: peter-evans/create-pull-request@v7
        with:
          branch: refresh/data
          title: "Data refresh ${{ steps.build.outputs.run_id }} needs review"
          body-path: data/site/review_report.md
          commit-message: "data: refresh ${{ steps.build.outputs.run_id }} (needs review)"
          add-paths: |
            data/processed
            data/site
            data/raw/prices
          labels: data-refresh
          delete-branch: true
