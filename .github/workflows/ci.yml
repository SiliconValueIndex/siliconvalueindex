name: CI

on:
  pull_request:
  push:
    branches: [main, overhaul]

jobs:
  pipeline:
    name: Python pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest
      - name: Offline build must reproduce data/site
        run: |
          svi build --offline --run-id ci-check
          git diff --stat -- data/site/gpus.json data/site/rankings.json

  site:
    name: Astro site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run check --if-present
      - run: npm test
      - run: npm run build
