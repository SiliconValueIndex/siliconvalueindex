name: Check Newegg catalog
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - name: Read catalog
        env:
          RAKUTEN_SFTP_USERNAME: ${{ secrets.RAKUTEN_SFTP_USERNAME }}
          RAKUTEN_SFTP_PASSWORD: ${{ secrets.RAKUTEN_SFTP_PASSWORD }}
          RAKUTEN_SID: ${{ secrets.RAKUTEN_SID }}
        run: python -m svi.scrapers.catalog
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-check
          path: catalog-check.json
          retention-days: 7
